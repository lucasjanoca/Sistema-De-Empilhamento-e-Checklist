name: Importar Site Selene 2.0 original
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".site-import/Site-2.0.zip"
      - ".github/workflows/import-original-site.yml"

permissions:
  contents: write

jobs:
  import-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Extrair site original
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/site2 empilhadores
          mkdir -p /tmp/site2 empilhadores
          unzip -q ".site-import/Site-2.0.zip" -d /tmp/site2
          cp -a "/tmp/site2/Site Selene/public/." empilhadores/
      - name: Conectar código do Checklist sem alterar o visual original
        shell: bash
        env:
          CODE_CSS_B64: 
          CODE_JS_B64: 
        run: |
          set -euo pipefail
          printf '%s' "$CODE_CSS_B64" | base64 -d > empilhadores/assets/checklist-code.css
          printf '%s' "$CODE_JS_B64" | base64 -d > empilhadores/assets/checklist-code.js
          python3 - <<'PY'
          from pathlib import Path
          p=Path("empilhadores/index.html")
          s=p.read_text(encoding="utf-8")
          css='<link rel="stylesheet" href="assets/checklist-code.css">'
          shared='<script src="../shared/access-code.js"></script>'
          js='<script src="assets/checklist-code.js"></script>'
          if css not in s:
              anchor='<link rel="stylesheet" href="assets/operation-focus.css">'
              s=s.replace(anchor, anchor+"\n  "+css)
          if shared not in s:
              anchor='<script src="assets/app.bundle.js"></script>'
              s=s.replace(anchor, shared+"\n  "+anchor)
          if js not in s:
              anchor='<script src="assets/operation-focus.js"></script>'
              s=s.replace(anchor, anchor+"\n  "+js)
          p.write_text(s,encoding="utf-8")
          PY
      - name: Limpar partes temporárias e publicar
        shell: bash
        run: |
          set -euo pipefail
          rm -f .site-import/chunk-*.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add empilhadores .site-import
          if git diff --cached --quiet; then
            echo "Nenhuma alteração."
            exit 0
          fi
          git commit -m "Publica Site Selene 2.0 original com códigos do Checklist"
          git push
